services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: helix-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      # Disable telemetry for local dev
      QDRANT__TELEMETRY_DISABLED: "true"

volumes:
  qdrant_data:
